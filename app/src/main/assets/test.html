<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ensō engine check</title>
<style>
  body { margin: 0; padding: 24px; background: #FAF9F7; color: #26232B;
         font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 24px; }
  dt { color: #5F5B66; }
  dd { margin: 0; overflow-wrap: anywhere; }
  a { color: #4F7CFF; }
</style>
</head>
<body>
<h1>Ensō · engine check</h1>
<dl>
  <dt>Engine</dt><dd id="engine">JavaScript is off</dd>
  <dt>Viewport</dt><dd id="viewport"></dd>
  <dt>User agent</dt><dd id="ua"></dd>
</dl>
<p>Fold or unfold the phone: the viewport above should update without the page reloading.</p>
<p><a href="https://www.mozilla.org/">Open mozilla.org</a> to check networking.</p>
<script>
  const gecko = navigator.userAgent.match(/rv:([\d.]+)/);
  document.getElementById("engine").textContent = gecko ? "Gecko " + gecko[1] : "Not Gecko?";
  document.getElementById("ua").textContent = navigator.userAgent;
  const showViewport = () => {
    document.getElementById("viewport").textContent =
      innerWidth + " × " + innerHeight + " CSS px @ " + devicePixelRatio + "x";
  };
  showViewport();
  addEventListener("resize", showViewport);
</script>
</body>
</html>
